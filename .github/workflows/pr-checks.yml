# Runs the repo's own smoke test on every pull request, so CodeRabbit's review
# and a green build check sit side by side on the same PR.
#
# History worth keeping: this workflow used to run `bash src/smoke.sh` with no
# browser available. smoke.sh detected the missing harness and exited 0, so the
# check went green after 3 of its 25 assertions — it never opened a page, never
# rendered a route, and never measured contrast. Several PRs merged under that
# tick. The playwright steps below are what make the other 22 real.
name: pr-checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # Same runtime used for the local TypeScript-stripping handler tests.
          node-version: "24.16.0"
      - name: Implant tripwire (folderOpen RCE removed 2026-09-12)
        run: |
          node --test scripts/no-implant-check.test.mjs tools/check-anon-surface.test.mjs
          node scripts/no-implant-check.mjs
      - name: Install locked SDK for intercepted API integration test
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Extraction and webhook security boundaries (no external services)
        run: |
          node --test supabase/functions/club-site-extract/safety.test.mjs supabase/functions/stripe-webhook/signature.test.mjs supabase/functions/guardian-link/link.test.mjs supabase/functions/ncsi-webhook/webhook.test.mjs tests/trust/badge-provenance.spec.ts tests/trust/queue-provenance.spec.ts tests/auth/onboarding-flow.spec.ts tests/migration/sessions-to-event.spec.ts tests/scheduling/conflicts.spec.ts tests/scheduling/cancel-propagation.spec.ts tests/scheduling/ics-feed.spec.ts supabase/functions/calendar-feed/feed.test.mjs tests/parent/token-scope.spec.ts tests/parent/rsvp-page.spec.ts tests/auth/staff-access.spec.ts tests/scheduling/schedule-screen.spec.ts tests/money/money-screen.spec.ts tests/import/validation.spec.ts tests/scheduling/edit-conflicts.spec.ts tests/ai/model-routing.spec.ts tests/ai/coach-command-pinning.spec.ts tests/dashboard/resolution.spec.ts tests/dashboard/rls-per-block.spec.ts tests/dashboard/seed-defaults.spec.ts tests/dashboard/capability-derivation.spec.ts tests/dashboard/multi-org-isolation.spec.ts tests/dashboard/permission-revocation.spec.ts
          node --test supabase/functions/Join-Waitlist/security.test.mjs
          node --test supabase/functions/unsubscribe/security.test.mjs
          node --test supabase/functions/lifecycle-process/security.test.mjs supabase/functions/lifecycle-process/policy.test.mjs
          node --test supabase/functions/billing-webhook/handler.test.mjs
          node --test supabase/functions/_shared/entitlements.test.mjs
          node --test supabase/functions/_shared/google-scopes.test.mjs
          node --test supabase/functions/_shared/gmail-read.test.mjs
          node --test supabase/functions/_shared/connector-registry.test.mjs
          node --test tests/e2e/oauth-redirect.spec.mjs
          node scripts/ai-contract-test.mjs
          node --test scripts/ai-security-test.mjs

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Pinned rather than floating: a browser engine that changes under us
      # would turn rendering assertions into flakes, and a flaky gate gets
      # ignored, which is how the gate became decorative in the first place.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.62.1

      - name: Install production dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright harness
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1

      - name: Install Chromium
        # `--with-deps` runs apt-get, which pulls Google's Debian index. On
        # 2026-09-09 that index served a corrupt Packages.gz ("Hash Sum
        # mismatch") and every PR's smoke job died at exit 100 before a single
        # assertion ran — an outage on Google's side failing our gate. Playwright
        # ships its own Chromium build and the ubuntu-latest image already
        # carries the shared libraries it needs, so try the dependency-free
        # install first and only fall back to apt if that browser cannot launch.
        run: |
          npx playwright install chromium
          node -e "require('playwright').chromium.launch().then(b=>b.close()).then(()=>console.log('chromium launches'))" \
            || { echo "falling back to --with-deps"; npx playwright install --with-deps chromium; }

      - name: Build
        run: python3 src/build.py

      # Contract tests are deterministic (no live network — the AI test mocks
      # the quota RPC, data-contract uses a mock Supabase URL). They existed in
      # the repo but nothing ran them; wired in here so the AI-endpoint auth /
      # quota / injection-resistance contract (and the repo + data contracts)
      # actually gate a PR instead of rotting.
      # The three fundamentals (owner 2026-09-17): cold start lands in the
      # org's own workspace, every signup button works, signup data persists
      # to the dashboard. Drives the built page in Chromium against an
      # in-memory Supabase double — no network, no live project.
      - name: Fundamentals (browser · fake backend)
        run: node --test --test-concurrency=1 --test-timeout=300000 tests/e2e/fundamentals.spec.mjs tests/e2e/import-receipt.spec.mjs tests/e2e/import-validation.spec.mjs tests/e2e/staff-workspace.spec.mjs tests/e2e/schedule.spec.mjs tests/e2e/money.spec.mjs tests/e2e/dock.spec.mjs tests/e2e/offline.spec.mjs tests/e2e/narrow.spec.mjs tests/dashboard/degradation.spec.ts tests/dashboard/no-fabrication.spec.ts tests/perf/dashboard-budget.spec.ts tests/perf/boot-requests.spec.ts

      # The verification agent: doc 28's five laws and doc 29's protocol, run as
      # ~250 checks over every surface × org scale × role × viewport, plus the
      # adversarial matrix and a number for every performance row. Deterministic
      # and offline — no live project, no model, no key, no money — so it can
      # gate every PR rather than waiting for someone to decide it is worth a
      # live audit. Exits non-zero on any P0.
      - name: Verification agent (doc 28 · doc 29)
        run: node tools/verify/run.mjs --out "$RUNNER_TEMP/verification.md"

      - name: Contract tests (gates · agents · ai · repo · data · onboarding)
        run: |
          python3 scripts/gates-status.py
          python3 scripts/codex-agent-contract-test.py
          node scripts/ai-contract-test.mjs
          node scripts/repo-contract-test.mjs
          node scripts/data-contract-test.mjs
          node scripts/getting-started-contract-test.mjs
          node scripts/sporv-agent-response-test.mjs

      - name: Smoke (all checks, browser included)
        run: ./src/smoke.sh
