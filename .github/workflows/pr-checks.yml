# Runs the repo's own smoke test on every pull request, so CodeRabbit's review
# and a green build check sit side by side on the same PR.
#
# History worth keeping: this workflow used to run `bash src/smoke.sh` with no
# browser available. smoke.sh detected the missing harness and exited 0, so the
# check went green after 3 of its 25 assertions — it never opened a page, never
# rendered a route, and never measured contrast. Several PRs merged under that
# tick. The playwright steps below are what make the other 22 real.
name: pr-checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned rather than floating: a browser engine that changes under us
      # would turn rendering assertions into flakes, and a flaky gate gets
      # ignored, which is how the gate became decorative in the first place.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.62.1

      - name: Install production dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright harness
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: python3 src/build.py

      # TEMPORARY DIAGNOSTIC: CI renders product-page headlines 1-2 lines
      # taller than every local run of the identical harness. Ask this exact
      # browser which embedded faces decode, and what actually renders.
      - name: Font probe (diagnostic)
        run: |
          rm -f .ci-browse-port
          node src/ci-browse.mjs serve >/tmp/cib.log 2>&1 &
          for i in $(seq 1 50); do [ -f .ci-browse-port ] && break; sleep 0.2; done
          node src/ci-browse.mjs viewport 1440x900
          node src/ci-browse.mjs goto "file://$PWD/index.html"
          node src/ci-browse.mjs js "(async()=>{const out=[];for(const f of document.fonts){try{await f.load();out.push(f.family+'='+f.status)}catch(e){out.push(f.family+'=ERR:'+String(e).slice(0,80))}}return out.join(' | ')})()"
          node src/ci-browse.mjs js "S.portal='family';S.auth={status:'guest'};S.route={name:'page',arg:'insights'};render();(()=>{const h=document.querySelector('.pg-h1');const cs=getComputedStyle(h);return 'fam='+cs.fontFamily.slice(0,60)+' size='+cs.fontSize+' lh='+cs.lineHeight+' w='+Math.round(h.getBoundingClientRect().width)+' hh='+Math.round(h.getBoundingClientRect().height)+' check='+document.fonts.check('16px Archivo')+' vw='+window.innerWidth})()"
          node src/ci-browse.mjs stop || true

      - name: Smoke (all checks, browser included)
        run: ./src/smoke.sh
