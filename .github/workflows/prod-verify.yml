# Verifies production after every merge to main.
#
# A green PR check proves the code was sound before merge. It does not prove
# what is being served afterwards — a deploy can fail, roll back, land a stale
# build, or silently lose its security headers to a config change, and none of
# that shows up on the PR. This is the repo's "not done until verified live"
# rule expressed as CI rather than as a habit someone has to remember.
name: prod-verify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Rebuild so the expected build stamp is derived from this commit's
      # sources rather than trusting the committed index.html.
      - name: Build
        run: python3 src/build.py
      - name: Verify production
        run: ./src/verify-prod.sh
