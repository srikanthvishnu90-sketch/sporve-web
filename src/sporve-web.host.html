  transition:background .15s ease,color .15s ease;
}
.roleswitch button:hover{color:var(--ink)}
.roleswitch button.on{background:var(--ink);color:#fff;box-shadow:none}

/* ── nav links ───────────────────────────────────────────────────── */
/* §3 tertiary — a text link, not a pill. One weight, one size, matching the
   primary nav row so the whole bar reads as one set. */
.navlink{
  display:inline-flex;align-items:center;gap:6px;height:var(--h-compact);padding:0 2px;
  border-radius:0;font-family:var(--nav-face);font-size:var(--t-body);font-weight:600;color:#FFFFFF;
  white-space:nowrap;transition:color .15s;
}
.navlink:hover{background:none;color:#8FA3BC}
/* §3 — "Become a coach" is plain white nav text: no border, no fill, no pill.
   Weight 500, resting opacity .85, brightening to full on hover (colour held
   at white — it must not resolve to slate like a generic .navlink). */
.topnav .navlink.becomecoach{font-weight:500;color:#FFFFFF;opacity:.85;transition:opacity .15s}
.topnav .navlink.becomecoach:hover{color:#FFFFFF;opacity:1}
/* Top-bar nav sizing/colour (owner ask): larger, Squarespace-scale type across
   the whole bar, and the centre menu resting WHITE. Safe on colour law — the
   topbar is always #09090B (no scroll flip to a light ground), so white text
   never lands on white. Scoped to .navcenter/.topnav so the product-page
   .tnav-row is untouched. Active .on keeps its slate-tint chip (:not(.on)). */
.navcenter .tnav{font-size:15.5px}
.navcenter .tnav:not(.on){color:#FFFFFF}
.topnav .navlink{font-size:15.5px}
/* At <=900 the centred menu collapses; the account control becomes the sheet
   hamburger. On the narrowest bars the quiet "Become a coach" link yields
   space to the pill + hamburger. */
@media(max-width:900px){
  .navcenter{display:none}
  .acct{width:44px}
  .acct .burger{display:grid}
  .acct .avatar{display:none}
}
@media(max-width:560px){.topnav .becomecoach{display:none}}
@media(max-width:1180px){
  /* .becomecoach used to be display:none here, which deleted the entire coach
     acquisition CTA on phones and split-window laptops and left the toggle as
     the only way in. It stays at every breakpoint now. */
  .tnav-row{gap:18px;margin-left:8px}
  .tnav-row .tnav{font-size:var(--text-base)}
}
@media(max-width:820px){
  .tnav-row{overflow-x:auto;scrollbar-width:none}
  .tnav-row::-webkit-scrollbar{display:none}
}

/* ── hero panel — inset rounded photograph, search sitting on it ───
   Amboras' inset-panel geometry at a smaller height, with Zillow's
   search-inside-the-image placement. The dark gradient is painted in the same
   background shorthand as the photo, so a photo that never loads still leaves
   white type on something dark rather than on white. */
/* Sits directly under the bar now — the tab rail that used to divide
   them is gone, and the panel absorbs its height. */
/* §6 — same content, honest proportions. The panel's height is now defined by
   its content (96 top + stack + 96 bottom) instead of a min-height clamp that
   left ~160px of empty dark below the search bar. Margins match the page
   gutter, so the panel's edges line up with the card grid beneath it. */
.hero{padding:20px 0 0}
/* Black ground ONLY behind the photo-panel hero (explore/boot), so the area
   around the inset rounded animation reads black, not the white body. Light
   home/coachinfo heroes (no .hero-panel, dark text) stay untouched. */
.hero:has(.hero-panel){background:var(--ink)}
.hero-panel{
  position:relative;overflow:hidden;
  /* Full-bleed, not shell-width. The grid below stays capped at --shell; the
     panel breaks out of it and runs edge to edge on a 20px gutter, so the
     photograph is the widest thing on the page. */
  width:calc(100% - 40px);max-width:1760px;margin:0 auto;
  /* The frame carries the PHOTOGRAPHS' proportion, not an arbitrary height.
     The two are 1000x558 (1.792) and 1000x671 (1.490); 1000/612 is their
     geometric mean, so each gives up the same 4.4% per edge and neither is
     stretched. Squaring the frame to one of them would have cost the other
     ~17%. This is why the panel is tall — a short frame is what crops. */
  aspect-ratio:1000/612;
  border-radius:var(--r-card);
  display:grid;place-items:center;
  /* near-black with a slate tint under ~4% lightness variance — material,
     not a void, and no visible banding. Stays as the base layer so a panel
     with no photographs still puts white type on something dark. */
  background:radial-gradient(120% 88% at 50% 0%,#141922 0%,#0E1116 58%,var(--ink) 100%);
}
/* ── hero slideshow ────────────────────────────────────────────────
   One .hero-slide per photograph, all stacked on the panel. Each runs the
   same keyframe on its own delay: hold in place, slide OUT to the right,
   jump (while off-screen, so it is never seen) to the left park, wait its
   turn, slide back IN from the left. Every visible move is rightward, and
   the outgoing photo leaves exactly as the incoming one arrives.

   Cadence: 3s hold + .8s slide = 3.8s per photograph. The keyframe stops
   below are that cadence expressed against a TWO-photo cycle (7.6s):
   3.0/7.6 = 39.474%, 3.8/7.6 = 50%, 6.8/7.6 = 89.474%. Add a third
   photograph to assets/ and these percentages have to be recomputed
   against the new cycle length — see heroMediaHTML(). */
.hero-media{position:absolute;inset:0;overflow:hidden}
/* ::after is painted after the slides, so the scrim rides above the photo
   and below .hero-in. It only exists when a photograph does. */
.hero-media::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(9,11,16,.48) 0%,rgba(9,11,16,.64) 55%,rgba(9,11,16,.82) 100%);
}
.hero-slide{
  position:absolute;inset:0;background-position:center;background-size:cover;
  background-repeat:no-repeat;will-change:transform;
  animation:heroSlide var(--hero-cycle,7.6s) cubic-bezier(.65,0,.35,1) infinite;
}
/* Horizontal wipe plus a slow scale settle: the frame arrives at 1.04 and
   eases down to 1.0 while it holds, so the still period is never actually
   still. 0% and 100% carry the same scale or the loop would jump. */
@keyframes heroSlide{
  0%        {transform:translateX(0) scale(1.04)}      /* on screen, zooming */
  39.474%   {transform:translateX(0) scale(1)}         /* settled, hold ends */
  50%       {transform:translateX(100%) scale(1)}      /* slid off to the right */
  50.001%   {transform:translateX(-100%) scale(1.04)}  /* invisible re-park */
  89.474%   {transform:translateX(-100%) scale(1.04)}  /* waiting off to the left */
  100%      {transform:translateX(0) scale(1.04)}      /* slid back on, rightward */
}
@media (prefers-reduced-motion:reduce){
  .hero-slide{animation:none}
  .hero-slide + .hero-slide{display:none}    /* first photograph, held still */
}
.hero-in{
  position:relative;z-index:1;text-align:center;max-width:820px;width:100%;
  padding:96px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;
}
/* Scoped to .hero-panel, NOT .hero. These were written for the explore page's
   dark panel and leaked onto every `class="band hero"` section — which is the
   family landing AND the coach landing, rendering both headlines white on
   white. The copy was in the DOM the whole time and invisible to a human. */
.hero .display{
  font-size:var(--t-display);font-weight:700;
  letter-spacing:-.03em;line-height:1.05;max-width:24ch;
}
.hero-panel .display{color:var(--on-dark)}
/* on the white landing the pill needs its border to carry the edge */
.hero:not(:has(.hero-panel)) .searchpill{border-color:var(--rule-strong);box-shadow:var(--shadow-lift)}
/* --on-dark-2 (#C7D0DA) is tuned for a flat dark panel. Over a photograph its
   highlights eat it, so the lede holds near-white here. */
.hero-panel .hero-lede{color:rgba(255,255,255,.93)}
.sp-val{min-height:22px}
.hero-lede{
  /* The lead paragraph under the h1 -- the role --text-md exists for. It was on
     the h3 step, which made the hero support line compete with the headline. */
  color:var(--muted);font-size:var(--text-md);font-weight:400;max-width:600px;line-height:1.5;
}
/* §5 — one continuous pill. Definition comes from a soft shadow and a hairline,
   not a heavy border. Each side carries a micro-label so the field still says
   what it is after the placeholder is typed over — the single biggest reason
   the old bar read as generic. */
/* T2 — Zillow single-field hero search. On-scale input (var(--text-lg) = 17-19px
   named clamp, >=16 so no iOS zoom); white field, obsidian submit. */
.hero-search{margin:40px auto 0;max-width:720px;width:100%;display:flex;align-items:center;
  background:#FFFFFF;border-radius:14px;padding:6px 6px 6px 24px;
  box-shadow:0 8px 24px rgba(0,0,0,.35),0 32px 80px rgba(0,0,0,.45)}
/* #app-scoped to beat `#app input{font-size:--text-base}` (id specificity):
   --text-lg is a named clamp (17-19px, on-scale) and >=16 so iOS won't zoom. */
#app .hero-search input{flex:1;border:0;outline:none;background:none;font-family:var(--sans);
  font-size:var(--text-lg);font-weight:400;color:var(--ink);height:52px}
.hero-search input::placeholder{color:rgba(10,14,19,.45)}
.hero-search button{width:52px;height:52px;border-radius:10px;flex-shrink:0;background:var(--ink);
  color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
.hero-search button svg{width:20px;height:20px}
.hero-search button:hover{transform:scale(1.04)}
.hero-search:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.25),0 8px 24px rgba(0,0,0,.35),0 32px 80px rgba(0,0,0,.45)}
@media(prefers-reduced-motion:reduce){.hero-search button{transition:none}}
@media(max-width:720px){.hero-search{margin-top:32px;padding-left:18px}}
.hero .searchpill{
  width:min(720px,100%);max-width:none;height:64px;margin-top:16px;flex:0 0 auto;
  align-items:stretch;gap:0;padding:0 8px 0 0;
  border:1px solid var(--rule);border-radius:var(--r-pill);
  background:var(--paper);box-shadow:var(--shadow);
  transition:box-shadow .18s;
}
.hero .searchpill:hover{box-shadow:var(--shadow-lift)}
.hero .searchpill:focus-within{box-shadow:var(--shadow-lift),0 0 0 3px var(--slate-ring)}
.sp-seg{
  display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;
  flex:1;min-width:0;padding:0 24px;cursor:text;
  border-radius:var(--r-pill);transition:background .15s;
}
.sp-seg:focus-within{background:var(--raise)}
.sp-where{flex:0 0 26%}
.sp-age{flex:0 0 22%}
.sp-age select{appearance:none;-webkit-appearance:none;cursor:pointer;
  background:none;border:0;color:var(--ink);width:100%;min-width:0}
.sp-age select:focus{outline:none}
.sp-lbl{
  font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);line-height:1;
}
.sp-val{display:flex;align-items:center;gap:8px;min-width:0}
.sp-val svg{width:16px;height:16px;flex:0 0 auto;color:var(--faint)}
.hero .searchpill .seg{padding:0;font-size:var(--t-body);line-height:1.3;height:auto}
.hero .searchpill .divider{height:34px;align-self:center;background:var(--rule)}
.hero .searchpill:focus-within .divider{background:transparent}
.hero .searchpill .go{
  width:46px;height:46px;align-self:center;flex:0 0 auto;
  /* slate, not accent: the hero search submit is the page's primary action and
     under the token law a primary CTA is neutral/slate, not a sport hue. */
  background:var(--slate);color:#fff;transition:background .15s,transform .12s;
}
.hero .searchpill .go:hover{background:var(--slate-deep)}
.hero .searchpill .go:active{transform:scale(.96)}
.hero .searchpill .go svg{width:18px;height:18px}

@media(max-width:640px){
  .hero{padding:16px 0 0}
  /* A 1.63 frame at phone width is 210px tall — shorter than the headline.
     Drop the ratio here and let the content set the height again; a portrait
     viewport crops a landscape photograph no matter what the frame does. */
  .hero-panel{width:calc(100% - 24px);aspect-ratio:auto;border-radius:var(--r-card)}
  .hero-in{padding:56px 18px;gap:14px}
  .hero .searchpill{height:auto;flex-wrap:wrap;padding:8px;gap:6px;border-radius:var(--r-card)}
  .sp-seg,.sp-where{flex:1 0 100%;padding:10px 14px;border:1px solid var(--rule);border-radius:var(--r-ctl)}
  .hero .searchpill .divider{display:none}
  .hero .searchpill .go{width:100%;height:var(--h-ctl);border-radius:var(--r-ctl)}
}

/* ── quick filter chips ──────────────────────────────────────────── */
/* §3 — 36px, pill, hairline. Real toggle states: active is a near-black fill,
   not a tint. The count shares the row's baseline rather than floating. */
.fchips{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:0 0 24px;border-bottom:1px solid var(--rule);
}
.fchip{
  display:inline-flex;align-items:center;gap:8px;height:var(--h-compact);padding:0 16px;
  border-radius:var(--r-pill);background:var(--paper);border:1px solid var(--rule-strong);
  color:var(--ink-2);font-size:var(--t-small);font-weight:500;letter-spacing:-.008em;
  transition:background .15s,border-color .15s,color .15s;
}
.fchip:hover{background:var(--raise);border-color:var(--ink-2);color:var(--ink)}
.fchip:focus-visible{outline:none;box-shadow:0 0 0 3px var(--slate-ring)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.fchip.on:hover{background:var(--ink-2);border-color:var(--ink-2)}
.fchip svg{width:16px;height:16px;flex:0 0 auto}
.fchip .xm{display:inline-flex;opacity:.7}
.fchip.on:hover .xm{opacity:1}
.fcount{margin-left:auto;color:var(--faint);font-size:var(--t-small);line-height:var(--h-compact)}

/* ── boot surface: promo strip, kind tabs, map strip ─────────────────
   The browse band rides the slate canvas (band alt = --raise), so these three
   controls only add chrome — no new hex, every size on the 8-step scale. */
.promobar{background:#000}
.promobar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 0}
/* §3.5 — the banner speaks in the nav face too. Label uppercase at .14em;
   body one step up from the label. Sizes held on the 8-step scale: --text-xs
   (10.5) for the label, a 13px body (the spec's 11px/13.5px are off-scale and
   would trip the smoke type-scale gate, so they snap to the nearest steps). */
.promo-tag{font-family:var(--nav-face);font-weight:700;text-transform:uppercase;
  letter-spacing:.14em;font-size:var(--text-xs);color:#FFFFFF}
.promo-txt{font-family:var(--nav-face);color:#AEB8C4;font-size:13px}
.promo-link{font-family:var(--nav-face);margin-left:auto;color:var(--accent-on-dark);
  font-weight:700;font-size:var(--text-sm)}
/* §3.5 — the account sheet (the mobile hamburger target) inherits the nav face
   too, so header chrome reads as one register at every breakpoint. Scoped to
   this one modal so the shared .modal component is untouched elsewhere. */
.acct-sheet{font-family:var(--nav-face)}
/* ── coach entry gate (split-screen: login left, welcome video right) ── */
.coachgate{position:fixed;inset:0;z-index:90;display:grid;grid-template-columns:1fr 1fr;background:#09090B;overflow-y:auto}
.cg-left{position:relative;display:flex;flex-direction:column;justify-content:center;padding:56px clamp(28px,6vw,84px);min-height:100vh}
.cg-back{position:absolute;top:24px;left:24px;background:none;border:0;color:#8FA3BC;font-family:var(--sans);font-size:var(--text-base);cursor:pointer}
.cg-back:hover{color:#F7F9FF}
.cg-wordmark{font-family:var(--display);font-size:var(--text-xl);color:#F7F9FF;letter-spacing:-.01em;margin-bottom:40px;display:inline-flex;align-items:center;gap:10px}
.cg-logomark{flex:none;border-radius:7px}
.cg-h1{font-family:var(--display);font-size:var(--text-2xl);color:#F7F9FF;letter-spacing:-.02em;line-height:1.1;margin:0}
.cg-sub{font-family:var(--sans);color:#8FA3BC;font-size:var(--text-base);margin-top:12px;max-width:44ch;line-height:1.55}
.cg-form{margin-top:26px;max-width:400px;display:flex;flex-direction:column;gap:14px}
.cg-input{width:100%;height:54px;padding:0 16px;border-radius:12px;border:1px solid #2A333F;background:#14181D;color:#F7F9FF;font-family:var(--sans);font-size:var(--text-lg)}
.cg-input::placeholder{color:#8290A0}
.cg-input:focus{outline:none;border-color:#8FA3BC}
.cg-continue{height:54px;border-radius:12px;border:0;background:#8FA3BC;color:#0A0C0F;font-family:var(--sans);font-weight:700;font-size:var(--text-lg);cursor:pointer;transition:background .15s}
.cg-continue:hover{background:#A9BACF}
.cg-or{display:flex;align-items:center;gap:14px;margin:20px 0;color:#8FA3BC;font-family:var(--sans);font-size:var(--text-sm);max-width:400px}
.cg-or::before,.cg-or::after{content:"";flex:1;height:1px;background:#222A33}
.cg-oauth{display:flex;flex-direction:column;gap:12px;max-width:400px}
.cg-social{height:54px;border-radius:12px;border:1px solid #2A333F;background:#14181D;color:#F7F9FF;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:var(--text-base);transition:background .15s}
.cg-social:hover{background:#1B2027}
.cg-social--light{background:#FFFFFF;color:#0A0C0F;border-color:#FFFFFF}
.cg-social--light:hover{background:#E9EEF4}
.cg-social-ic{position:absolute;left:16px;display:grid;place-items:center}
.cg-sq{width:54px;height:54px;border-radius:12px;border:1px solid #2A333F;background:#14181D;color:#F7F9FF;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.cg-sq:hover{background:#1B2027}
.cg-fine{margin-top:26px;color:#8FA3BC;font-family:var(--sans);font-size:var(--text-sm)}
.cg-fine button{background:none;border:0;color:#F7F9FF;cursor:pointer;text-decoration:underline;font:inherit}
.cg-right{position:relative;overflow:hidden;background:#000;display:grid;place-items:center}
.cg-welcome{font-family:var(--display);font-size:var(--text-hero);color:#F7F9FF;letter-spacing:-.02em;text-align:center;padding:24px;line-height:1.05}
.cg-type{display:inline-block;white-space:nowrap;border-right:.055em solid #F7F9FF;clip-path:inset(0 100% 0 0);animation:cgtype 1.9s steps(17,end) .15s forwards,cgcaret .75s step-end infinite}
@keyframes cgtype{to{clip-path:inset(0 -.12em 0 0)}}
@keyframes cgcaret{50%{border-color:transparent}}
.cg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(max-width:900px){.coachgate{grid-template-columns:1fr}.cg-right{display:none}}
.promo-link:hover{text-decoration:underline}
.kindtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.kindtab{display:inline-flex;align-items:center;height:var(--h-compact);padding:0 16px;
  border-radius:var(--r-pill);background:var(--paper);border:1px solid var(--rule-strong);
  color:var(--muted);font-size:var(--t-small);font-weight:600;letter-spacing:-.008em;
  transition:background .15s,border-color .15s,color .15s}
.kindtab:hover{border-color:var(--ink-2);color:var(--ink)}
.kindtab:focus-visible{outline:none;box-shadow:0 0 0 3px var(--slate-ring)}
.kindtab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.mapstrip-in{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
/* Boot-surface light bands ride the DARKER shipped slate (#E9EEF4, the same
   ground as .pgband.slate), not the near-white --raise (#F7F8FA). Cards stay
   white (--paper) on top, so the section keeps its slate cast. No new hex. */
.band.slate{background:#E9EEF4;border-bottom-color:#CBD5E1}

/* ── product overview page ───────────────────────────────────────── */
.exhero{
  display:flex;justify-content:space-between;align-items:flex-end;gap:30px;
  padding:48px 0 4px;flex-wrap:wrap;
}
/* No letter-spacing here: the +.005em caps carve-out above already names this
   selector, and repeating -.015em at equal specificity but later in the sheet
   silently defeated it. Measured -0.4752px where +.005em was intended. */
.exhero h1{font-size:var(--text-hero);font-weight:700;line-height:1.04}
.exlede{color:var(--muted);font-size:var(--text-md);max-width:560px;margin-top:14px;line-height:1.5}
.advfilters{
  display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:999px;
  background:var(--paper);border:1px solid var(--rule-strong);font-weight:700;font-size:var(--text-base);
  box-shadow:var(--shadow);transition:.15s;flex:0 0 auto;
}
.advfilters:hover{border-color:var(--ink);transform:translateY(-1px)}
.prodgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));
  gap:18px;padding:6px 0 12px;
}
/* §6.7 — frameless: no border, no shadow, no icon tile. A hairline top rule and
   a --ink marker do the work; shadows live only on genuinely interactive chrome. */
.prodcard{
  text-align:left;display:flex;flex-direction:column;gap:6px;padding:22px 20px 22px 18px;
  background:transparent;border-top:1px solid var(--rule);border-radius:0;transition:background .16s;
}
.prodcard:hover{background:var(--raise)}
.prodcard b{font-size:var(--text-base);letter-spacing:-.022em;position:relative}
.prodcard b::before{content:"";position:absolute;left:-18px;top:.55em;width:7px;height:7px;
  border-radius:var(--r-pill);background:var(--ink-2)}
.prodcard span{color:var(--muted);font-size:var(--text-base);line-height:1.5}
.prodsec{padding:34px 0 8px}
/* An h2 takes the h2 step and the caps tracking. It was on --text-xl at
   -.03em, which is a face-specific tuning from before Syne. Its .sub is a
   section subhead, not hero support, so it is body copy not --text-md. */
.prodsec h2{font-size:var(--text-2xl)}
.prodsec .sub{color:var(--muted);font-size:var(--text-base);margin-top:8px;max-width:620px}

/* ── cards ───────────────────────────────────────────────────────── */
.grid{
  display:grid;gap:24px 22px;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  padding:30px 0 56px;
}

/* ── browse rails — the default home feed (Uber-Eats pattern). Three titled
   rows, one per provider type, each a horizontally-scrolling track of the same
   .card. Only the unfiltered browse view renders rails; an active search or
   filter falls back to the flat .grid so MOD_SEARCH's node-level filtering
   keeps working. The track scrolls internally (overflow-x on itself), never the
   page body, so the no-horizontal-overflow invariant holds. */
.rails{padding:24px 0 52px;display:flex;flex-direction:column;gap:38px}
.rail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:15px}
.rail-head h2{font-size:var(--text-2xl);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.rail-head .rsub{color:var(--muted);font-size:var(--text-sm);margin-top:5px}
.rail-arrows{display:flex;gap:8px;flex:0 0 auto}
.rail-arrow{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;
  background:var(--raise);color:var(--ink);transition:background .15s,transform .15s;flex:0 0 auto}
.rail-arrow:hover{background:var(--raise2);transform:translateY(-1px)}
.rail-track{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x proximity;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 2px 8px;margin:0 -2px}
.rail-track::-webkit-scrollbar{display:none}
.rail-track>.card{flex:0 0 228px;scroll-snap-align:start}
@media(max-width:640px){
  .rail-head h2{font-size:var(--text-xl)}
  .rail-arrows{display:none}
  .rail-track>.card{flex-basis:80vw}
}

/* ── T4 · Zillow-style kind bands ─────────────────────────────────────
   Three titled rows on the light browse canvas — Private / Camps / Teams —
   each a horizontally-scrolling .kindrow of the shrunk .card, separated by
   full-width hairlines. The row scrolls INTERNALLY (overflow-x on itself),
   never the page body, so the no-horizontal-overflow invariant holds.
   .kindrow (not .rail-track: that class is a grid layout elsewhere at ~1376).
   Owner override of the §6.4 no-rails rule via the six-task spec 2026-08-08. */
.kind-band{padding:30px 0 34px;scroll-margin-top:92px}
.kind-band .band-rule{border-top:1px solid var(--rule-strong);margin:0 0 26px}
.kind-band:first-of-type .band-rule{display:none}
.band-head{display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;margin-bottom:16px;flex-wrap:wrap}
.band-title{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.6vw,32px);
  line-height:1.08;letter-spacing:-.01em;color:var(--ink)}
.band-title em{font-style:italic}
.band-sub{font-family:var(--sans);color:var(--muted);font-size:var(--text-sm);
  margin-top:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo-pill{display:inline-flex;align-items:center;height:20px;padding:0 9px;
  border-radius:var(--r-pill);background:var(--slate-tint);color:var(--slate);
  font-size:var(--text-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.band-tools{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.seeall{font-family:var(--sans);color:var(--slate);font-weight:700;
  font-size:var(--text-sm);white-space:nowrap}
.seeall:hover{color:var(--ink);text-decoration:underline}
.pagers{display:flex;gap:8px}
.pager{width:36px;height:36px;border-radius:var(--r-pill);display:grid;place-items:center;
  background:var(--paper);border:1px solid var(--rule-strong);color:var(--ink);
  transition:background .15s,transform .15s,opacity .15s;flex:0 0 auto}
.pager:hover:not(:disabled){background:var(--raise);transform:translateY(-1px)}
.pager:disabled{opacity:.35;cursor:default;transform:none}
.pager:focus-visible{outline:none;box-shadow:0 0 0 3px var(--slate-ring)}
.kindrow{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:4px 0}
.kindrow::-webkit-scrollbar{display:none}
.kindrow>.card{flex:0 0 228px;scroll-snap-align:start}
.kindrow-empty{color:var(--muted);font-size:var(--text-sm);padding:8px 2px}
@media(max-width:640px){
  .pagers{display:none}
  .kindrow>.card{flex-basis:80vw}
}
.card{
  text-align:left;display:flex;flex-direction:column;gap:7px;position:relative;
  background:var(--paper);border-radius:var(--r-xl);overflow:hidden;
  box-shadow:0 1px 2px rgba(10,14,19,.06);
  transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(10,14,19,.14)}
.card>*:not(.shot):not(.featfoot){padding-left:14px;padding-right:14px}
.card>*:last-child:not(.featfoot){padding-bottom:14px}
.card .shot{
  position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--raise2);
}

/* ── featured card — two columns wide, content over the photograph ─ */
/* order:-1 rather than DOM position: MOD_SEARCH sorts the grid by reordering
   the card nodes, so the wide card has to hold the lead slot in the layout. */
.card.feature{grid-column:span 2;gap:0;order:-1}
.card.feature .shot{aspect-ratio:16/9}
.card.feature .fov{
  position:absolute;inset:auto 0 0 0;z-index:2;padding:22px;pointer-events:none;
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;color:#fff;
  background:linear-gradient(to top,rgba(8,10,14,.88),rgba(8,10,14,.34) 58%,transparent);
}
.card.feature .fov h3{font-size:var(--text-2xl);font-weight:700;color:#fff}
.card.feature .fov .biz2{color:rgba(255,255,255,.8);font-size:var(--text-base);margin-top:5px}
.featbadge{
  display:inline-flex;align-items:center;padding:5px 11px;border-radius:6px;margin-bottom:12px;
  background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.26);
  font-size:var(--text-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;
}
.featrate{
  display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:999px;
  background:rgba(255,255,255,.95);color:var(--ink);font-size:var(--text-base);font-weight:700;flex:0 0 auto;
}
.featfoot{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:17px 20px 19px;
}
.featloc{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:var(--text-base)}
.featprice{
  padding:9px 17px;border-radius:999px;background:var(--slate-tint);color:var(--ink);
  font-size:var(--text-base);font-weight:700;flex:0 0 auto;
}
@media(max-width:640px){.card.feature{grid-column:span 1}.card.feature .shot{aspect-ratio:20/19}}
.card .shot img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.card:hover .shot img{transform:scale(1.045)}
.heart{
  position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:999px;
  display:grid;place-items:center;background:rgba(11,12,14,.32);backdrop-filter:blur(6px);
  color:#fff;transition:.15s;z-index:2;
}
.heart:hover{transform:scale(1.09);background:rgba(11,12,14,.5)}
.heart.on{color:#FF5A6E}
.sporttag{
  position:absolute;top:10px;left:10px;z-index:2;display:flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
  font-size:var(--text-sm);font-weight:600;letter-spacing:-.01em;color:var(--ink);
}
.sporttag i{width:7px;height:7px;border-radius:2px;display:block}
.card .heart svg{width:14px;height:14px}
.card .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
/* The provider name -- the landing's "coach name" role: t-display at the card
   step, uppercase, tracked open a touch because it sits at a small cap size. */
.card .biz{font-family:var(--sans);font-weight:600;font-size:var(--text-base);
  color:var(--ink);letter-spacing:-.01em;line-height:1.2}
.card .rate{display:flex;align-items:center;gap:3px;font-family:var(--mono);
  font-weight:600;font-size:var(--text-sm);flex:0 0 auto}
.card .rate svg{width:10px;height:10px}
.card .ttl{color:var(--muted);font-size:var(--text-base);line-height:1.4}
.card .meta{color:var(--faint);font-size:var(--text-sm)}
.card .price{font-family:var(--mono);font-weight:600;font-size:var(--text-base);
  color:var(--ink);margin-top:1px}
.card .price b{font-weight:600}
.card .price span{font-family:var(--sans);font-size:var(--text-sm)}
.card .verifline svg,.card .pendline svg{width:11px;height:11px}
.verifline{display:flex;align-items:center;gap:5px;font-size:var(--text-sm);font-weight:600;color:var(--gold-ink)}
.pendline{display:flex;align-items:center;gap:5px;font-size:var(--text-sm);font-weight:600;color:var(--warn)}

/* ── generic ui ──────────────────────────────────────────────────── */
/* §3 — three variants, two heights, nothing else.
   primary  = .btn          filled accent
   secondary= .btn.ghost    outline, near-black text
   tertiary = .navlink/.tlink  text link
   48px is the default height; .sm is the only other, at 36px. */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:var(--h-ctl);padding:0 20px;border-radius:var(--r-ctl);
  font-weight:600;font-size:var(--t-small);letter-spacing:-.008em;
  /* Primary CTA is SLATE, not orange. The token system's law is that black +
     white + slate carry all chrome and sport colour is accent-only, attached
     to a sport object -- so a generic button cannot wear a sport hue.
     --accent #C2410C is basketball's #DA5A05 to within a hair, i.e. a sport
     colour that had been promoted to universal chrome, which is exactly what
     the law forbids and what made every page read as "too much orange".
     Orange now survives ONLY as SPORT_COLOR.Basketball on a basketball tag.
     Slate #223140 carries white text at ~14:1. */
  background:var(--slate);color:#fff;
  transition:background .15s,box-shadow .15s,transform .12s;
}
.btn:hover{background:var(--slate-deep)}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--slate-ring)}
/* Owner's instruction: leave the black bands alone. A slate fill is 2.77:1 on
   black, so a filled button there uses the lighter slate that reads on it. */
.band.dark .btn:not(.ghost){background:#8FA3BC;color:#0B0C0E}
.band.dark .btn:not(.ghost):hover{background:#A9BACF}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn[aria-busy="true"]{opacity:.7;cursor:progress}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--rule-strong)}
.btn.ghost:hover{background:var(--raise);border-color:var(--ink)}
.btn.ghost:focus-visible{box-shadow:0 0 0 3px var(--slate-ring)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.dark:hover{background:var(--ink-2)}
.btn.sm{height:var(--h-compact);padding:0 14px;font-size:var(--t-small);border-radius:var(--r-ctl)}
.btn.wide{width:100%}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:var(--text-xs);font-weight:700;letter-spacing:-.005em;
}
.pill.gold{background:var(--gold-tint);color:var(--gold-ink)}
.pill.good{background:var(--good-tint);color:var(--good)}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.slate{background:var(--slate-tint);color:var(--slate)}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:var(--text-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  padding:13px 14px;border:1px solid var(--rule-strong);border-radius:var(--r-m);
  background:var(--paper);color:var(--ink);font:inherit;font-size:var(--text-base);width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--slate);box-shadow:0 0 0 3px var(--slate-ring)}
.err{color:var(--danger);font-size:var(--text-sm);font-weight:600}
.panel{border:1px solid var(--rule);border-radius:var(--r-l);padding:22px;background:var(--paper)}
.empty{padding:72px 24px;text-align:center;color:var(--muted)}
.empty .big{margin-bottom:14px;line-height:0}
/* Empty/auth states render a line-icon from ICON, not an emoji. Sized here and
   tinted muted so the glyph reads as a quiet placeholder, matching the chrome. */
.empty .big svg,.big svg{width:46px;height:46px;stroke:currentColor;stroke-width:1.5;
  fill:none;color:var(--faint)}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:34px 0 16px}

/* ── detail view ─────────────────────────────────────────────────── */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:56px;padding:26px 0 72px;align-items:start}
.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px;border-radius:var(--r-l);overflow:hidden;margin-bottom:26px}
.gallery img{width:100%;height:100%;object-fit:cover;aspect-ratio:1;background:var(--raise2)}
.gallery img:first-child{aspect-ratio:2/1.63}
.gallery .stack{display:grid;gap:8px}
.bookcard{
  position:sticky;top:170px;border:1px solid var(--rule-strong);border-radius:var(--r-l);
  padding:24px;box-shadow:var(--shadow-lift);background:var(--paper);
}
.linerow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:var(--text-base);color:var(--ink-2)}
.linerow.total{border-top:1px solid var(--rule);margin-top:8px;padding-top:15px;font-weight:700;color:var(--ink);font-size:var(--text-base)}
.slot{
  display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
  padding:13px 15px;border:1px solid var(--rule);border-radius:var(--r-m);text-align:left;transition:.15s;
}
.slot:hover{border-color:var(--ink-2);background:var(--raise)}
.slot.on{border-color:var(--slate);background:var(--slate-tint);box-shadow:0 0 0 1px var(--slate)}
.incl{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:0;margin:0;list-style:none}
.incl li{display:flex;gap:9px;align-items:flex-start;font-size:var(--text-base);color:var(--ink-2)}

/* ── modal / sheet ───────────────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;background:rgba(11,12,14,.5);backdrop-filter:blur(3px);
  z-index:100;display:grid;place-items:center;padding:24px;animation:fade .16s ease;
}
@keyframes fade{from{opacity:0}}
.modal{
  background:var(--paper);border-radius:var(--r-xl);width:100%;max-width:452px;
  max-height:88vh;overflow:auto;box-shadow:0 30px 90px -20px rgba(11,12,14,.5);
  animation:rise .22s cubic-bezier(.2,.7,.3,1);
}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.modal.wide{max-width:620px}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:17px 22px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper);z-index:2;
}
.modal-body{padding:24px}
.x{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--raise2);color:var(--ink)}
.rail-lite{transition:background .14s}
.rail-lite:hover{background:var(--raise2)}

/* ── messages ────────────────────────────────────────────────────── */
.msg-wrap{display:grid;grid-template-columns:320px 1fr;gap:0;border:1px solid var(--rule);border-radius:var(--r-l);overflow:hidden;height:min(660px,72vh);margin:26px 0 64px}
.msg-list{border-right:1px solid var(--rule);overflow-y:auto;background:var(--raise)}
.msg-item{display:flex;gap:12px;padding:15px 17px;width:100%;text-align:left;border-bottom:1px solid var(--rule);transition:.13s}
.msg-item:hover{background:var(--raise2)}
.msg-item.on{background:var(--paper);box-shadow:inset 3px 0 0 var(--slate)}
.msg-thread{display:flex;flex-direction:column;min-width:0}
.msg-scroll{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:11px}
.bub{max-width:70%;padding:11px 15px;border-radius:16px;font-size:var(--text-base);line-height:1.5}
.bub.them{background:var(--raise2);border-bottom-left-radius:5px;align-self:flex-start}
.bub.me{background:var(--slate);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.msg-compose{display:flex;gap:10px;padding:15px;border-top:1px solid var(--rule);background:var(--paper)}
.msg-compose input{flex:1;padding:12px 15px;border:1px solid var(--rule-strong);border-radius:999px;font:inherit;background:var(--paper);color:var(--ink)}
.msg-compose input:focus{outline:none;border-color:var(--slate)}
.msg-sub{color:var(--muted);font-size:var(--t-small);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-from{font-size:var(--t-small);font-weight:700;color:var(--muted);margin:0 0 -5px 3px}

/* ── people picker (group messaging) ─────────────────────────────── */
.pick-list{max-height:260px;overflow-y:auto;border:1px solid var(--rule);border-radius:var(--r-m);padding:4px}
.pick-row{display:flex;gap:11px;align-items:center;padding:10px 11px;border-radius:var(--r-s);cursor:pointer}
.pick-row:hover{background:var(--raise2)}
.pick-row input{width:17px;height:17px;accent-color:var(--slate);flex:none}
.pick-row b{display:block;font-size:var(--text-base)}
.pick-row span{color:var(--muted);font-size:var(--t-small)}

/* ── provider month calendar ─────────────────────────────────────── */
.cal-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.cal-title{font-size:var(--t-h3);font-weight:800;letter-spacing:-.018em;margin-right:auto}
.cal-nav{display:flex;align-items:center;gap:3px}
.cal-nav button{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.cal-nav button:hover{background:var(--raise2);color:var(--ink)}
.cal{border:1px solid var(--rule);border-radius:var(--r-l);overflow:hidden;background:var(--paper);margin-bottom:56px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--raise);border-bottom:1px solid var(--rule)}
.cal-dow span{padding:9px 10px;font-size:var(--t-small);font-weight:700;color:var(--muted);
  text-align:center;text-transform:uppercase;letter-spacing:.05em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:118px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:7px 8px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;
  background:var(--paper);transition:background .13s}
.cal-cell:nth-child(7n){border-right:0}
.cal-grid>.cal-cell:nth-last-child(-n+7){border-bottom:0}
.cal-cell.out{background:var(--raise)}
.cal-cell.out .cal-num{color:var(--faint)}
/* only a day with something on it is actionable — an empty cell that highlights
   on hover promises a sheet that would open empty */
.cal-cell.has{cursor:pointer}
.cal-cell.has:hover{background:var(--raise2)}
.cal-cell.has:focus-visible{outline:2px solid var(--slate);outline-offset:-2px}
.cal-num{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;
  font-size:var(--t-small);font-weight:700;color:var(--ink);flex:none}
.cal-num.today{background:var(--slate);color:#fff}
.cal-ev{display:flex;align-items:center;gap:6px;padding:3px 7px;border-radius:var(--r-s);
  font-size:var(--t-small);font-weight:650;line-height:1.35;min-width:0}
.cal-ev b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.cal-dot{width:7px;height:7px;border-radius:999px;flex:none}
.cal-more{font-size:var(--t-small);color:var(--muted);font-weight:700;padding-left:8px;margin-top:1px}
/* the day sheet */
.day-ev{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--rule)}
.day-ev:last-child{border-bottom:0}
.day-time{min-width:92px;flex:none;font-size:var(--t-small);font-weight:700;color:var(--muted);line-height:1.5}
.day-bar{width:3px;border-radius:2px;flex:none}
.day-meta{color:var(--muted);font-size:var(--t-small);margin-top:3px}
@media(max-width:860px){
  .cal-cell{min-height:86px;padding:5px 5px}
  .cal-ev{font-size:10px;padding:2px 5px;gap:4px}
  .cal-num{width:22px;height:22px}
}

/* ── provider dashboard ──────────────────────────────────────────── */
.dash{display:grid;grid-template-columns:216px 1fr;gap:38px;padding:26px 0 72px;align-items:start}
.rail{position:sticky;top:104px;display:flex;flex-direction:column;gap:2px}
.rail button{
  display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:var(--r-m);
  font-size:var(--text-base);font-weight:600;color:var(--muted);text-align:left;width:100%;transition:.14s;
}
.rail button:hover{background:var(--raise);color:var(--ink)}
.rail button.on{background:var(--ink);color:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:12px}
.stat{border:1px solid var(--rule);border-radius:var(--r-l);padding:18px}
.stat .k{font-size:var(--text-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-size:var(--text-xl);font-weight:800;letter-spacing:-.02em;margin-top:5px}
.stat .d{font-size:var(--text-sm);color:var(--muted);margin-top:2px}
.track{display:flex;align-items:center;gap:0;margin-top:13px}
.track .step{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.track .dot{width:17px;height:17px;border-radius:999px;border:2px solid var(--rule-strong);flex:0 0 auto;display:grid;place-items:center;font-size:9px;color:#fff}
.track .step.done .dot{background:var(--good);border-color:var(--good)}
.track .lbl{font-size:var(--text-xs);font-weight:600;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .step.done .lbl{color:var(--ink-2)}
.track .bar{height:2px;background:var(--rule-strong);flex:1;min-width:8px;margin:0 7px}
.track .step.done .bar{background:var(--good)}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--text-base)}
table.tbl th{text-align:left;font-size:var(--text-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 12px 10px;font-weight:700}
table.tbl td{padding:13px 12px;border-top:1px solid var(--rule);vertical-align:middle}
.tblwrap{overflow-x:auto}

/* ── map ─────────────────────────────────────────────────────────── */
.maplayout{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:26px;padding:6px 0 64px;align-items:start}
.mapcanvas{
  position:relative;height:min(620px,70vh);border:1px solid var(--rule);border-radius:var(--r-l);
  overflow:hidden;background:linear-gradient(160deg,#F2F5F8,#E8EEF3);
}
:root[data-theme="dark"] .mapcanvas{background:linear-gradient(160deg,#141920,#0F1318)}
.mapgrid{
  position:absolute;inset:0;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:64px 64px;opacity:.55;
}
.pin{
  position:absolute;transform:translate(-50%,-50%);z-index:2;
  background:var(--paper);border:1.5px solid var(--rule-strong);border-radius:999px;
  padding:5px 11px;font-size:var(--text-sm);font-weight:700;box-shadow:var(--shadow);
  transition:transform .16s cubic-bezier(.2,.7,.3,1),box-shadow .16s;white-space:nowrap;
}
.pin::after{
  content:"";position:absolute;left:7px;top:50%;transform:translateY(-50%);
  width:6px;height:6px;border-radius:2px;background:var(--pc);
}
.pin span{padding-left:11px}
.pin:hover{transform:translate(-50%,-50%) scale(1.11);box-shadow:var(--shadow-lift);z-index:4}
.pin.on{background:var(--ink);color:var(--paper);border-color:var(--ink);transform:translate(-50%,-50%) scale(1.13);z-index:5}
.mapnote{
  position:absolute;left:14px;bottom:14px;z-index:6;background:var(--paper);
  border:1px solid var(--rule);border-radius:999px;padding:7px 14px;
  font-size:var(--text-sm);color:var(--muted);box-shadow:var(--shadow);
}
.mapside{position:sticky;top:170px}

/* ── AI concierge ────────────────────────────────────────────────── */
.chatwrap{
  display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--r-l);
  overflow:hidden;height:min(600px,68vh);margin-bottom:56px;background:var(--paper);
}
.chatscroll{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.pickgrid{display:flex;flex-direction:column;gap:9px}
.pickcard{
  display:flex;gap:13px;align-items:center;text-align:left;width:100%;padding:11px;
  border:1px solid var(--rule);border-radius:var(--r-m);background:var(--paper);transition:.15s;
}
.pickcard:hover{border-color:var(--ink-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.pickcard img{width:62px;height:62px;border-radius:var(--r-s);object-fit:cover;flex:0 0 auto}
.pickcard .pi{display:flex;flex-direction:column;gap:3px;min-width:0}
.pickcard b{font-size:var(--text-base);letter-spacing:-.015em}
.dotdot{
  width:6px;height:6px;border-radius:999px;background:var(--muted);display:inline-block;
  animation:pulse 1.25s infinite cubic-bezier(.4,0,.2,1);
}
@keyframes pulse{0%,70%,100%{opacity:.26}35%{opacity:1}}

/* ── onboarding ──────────────────────────────────────────────────── */
.onbcard{
  display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;padding:17px;
  border:1.5px solid var(--rule);border-radius:var(--r-l);margin-bottom:12px;transition:.15s;
}
.onbcard:hover{border-color:var(--ink-2);background:var(--raise)}
.onbcard.on{border-color:var(--slate);background:var(--slate-tint);box-shadow:0 0 0 1px var(--slate)}
.onbcard b{font-size:var(--text-base);letter-spacing:-.02em}
.onbcard span{font-size:var(--text-sm);color:var(--muted);line-height:1.45}
.sportpick{
  padding:8px 13px;border:1px solid var(--rule);border-radius:999px;font-size:var(--text-sm);
  font-weight:600;transition:.14s;
}
.sportpick:hover{border-color:var(--ink-2)}
.sportpick.on{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent);color:var(--sc)}

/* ── landing bands ───────────────────────────────────────────────── */
.band{padding:74px 0;border-bottom:1px solid var(--rule)}
.band.alt{background:var(--raise)}
.band.hero{padding:86px 0 78px}
.hero-in{text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.display{
  font-size:var(--text-hero);font-weight:700;letter-spacing:-.015em;
  line-height:1.02;color:var(--ink);
}
/* The hero support line. This is the ONE thing --text-md exists for, per the
   scale's role table -- so it is a flat 15.5px, not a fluid 16-20px. */
.lede{font-size:var(--text-md);color:var(--ink-2);max-width:34ch;margin:0 auto;line-height:1.5}
.chiprow{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:8px}
.hchip{
  display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:999px;
  border:1px solid var(--rule-strong);font-size:var(--text-base);font-weight:700;
  background:var(--paper);transition:.15s;color:var(--ink);
}
.hchip i{width:8px;height:8px;border-radius:2px;display:block}
.hchip:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow)}
.hchip.alt{color:var(--slate)}
.bandhead{display:flex;align-items:center;gap:10px;margin-bottom:26px;color:var(--ink)}
.bandhead span{font-size:22px;color:var(--muted)}
.bandhead:hover span{color:var(--ink)}
h2.ctr,.ctr{text-align:center}
h2.ctr{margin-bottom:10px}
.sub{color:var(--muted);font-size:var(--text-base);line-height:1.55;max-width:60ch}
.sub.ctr{margin:0 auto 12px}
.sportgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stile{
  display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:20px;
  border:1px solid var(--rule);border-radius:var(--r-l);background:var(--paper);transition:.16s;text-align:left;
}
.stile:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow)}
.sdot{width:11px;height:11px;border-radius:var(--r-pill);margin-bottom:3px}
.stile b{font-size:var(--text-base);letter-spacing:-.015em}
.stile span.num{font-size:var(--text-sm);color:var(--muted)}
.segwrap{display:flex;justify-content:center;margin:24px 0 30px}
.seg2{display:flex;background:var(--raise2);border-radius:999px;padding:4px;gap:3px}
.band.alt .seg2{background:var(--paper)}
.seg2 button{padding:9px 20px;border-radius:999px;font-size:var(--text-base);font-weight:700;color:var(--muted);transition:.15s}
.seg2 button.on{background:var(--ink);color:var(--paper)}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.frame{
  border:1px solid var(--rule-strong);border-radius:var(--r-l);overflow:hidden;
  background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;
}
.frame.tall{min-height:380px}
.fbar{display:flex;gap:5px;padding:11px 13px;border-bottom:1px solid var(--rule);background:var(--raise)}
.fbar i{width:8px;height:8px;border-radius:999px;background:var(--rule-strong);display:block}
.fbody{padding:15px;display:flex;flex-direction:column;gap:9px;flex:1}
.fsearch{
  font-size:var(--text-sm);font-weight:700;color:var(--muted);padding:8px 11px;
  border:1px solid var(--rule);border-radius:999px;
}
.frow{display:flex;gap:10px;align-items:center}
.fthumb{width:34px;height:34px;border-radius:var(--r-s);flex:0 0 auto;display:block}
.frow b{display:block;font-size:var(--text-sm);letter-spacing:-.01em}
.frow .num{font-size:var(--text-sm);color:var(--muted)}
.fhero{height:70px;border-radius:var(--r-s)}
.fpill{
  align-self:flex-start;padding:4px 10px;border-radius:999px;font-size:var(--text-xs);font-weight:700;
}
.fpill.gold{background:var(--gold-tint);color:var(--gold-ink)}
.fpill.good{background:var(--good-tint);color:var(--good)}
.fcheck{
  width:42px;height:42px;border-radius:999px;background:var(--good-tint);color:var(--good);
  display:grid;place-items:center;font-size:var(--text-lg);margin:6px auto 2px;
}
.fbub{padding:8px 12px;border-radius:13px;font-size:var(--text-sm);max-width:88%}
.fbub.them{background:var(--raise2);align-self:flex-start;border-bottom-left-radius:4px}
.fbub.me{background:var(--slate);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.fskel{height:11px;border-radius:999px;background:var(--raise2)}
.fskel.s{width:62%}
.fstats{display:flex;gap:16px;margin:4px 0 8px}
.fstats div{display:flex;flex-direction:column}
.fstats span:first-child{font-size:var(--text-lg);font-weight:800;letter-spacing:-.02em}
.fstats span:last-child{font-size:var(--text-xs);color:var(--muted)}
.fcap{
  padding:11px 15px;border-top:1px solid var(--rule);font-size:var(--text-sm);
  color:var(--muted);background:var(--raise);
}
.risk{color:var(--muted);font-size:var(--text-base);margin-top:20px}
.featgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.feat{padding:22px;border:1px solid var(--rule);border-radius:var(--r-l);background:var(--paper)}
.feat b{display:block;font-size:var(--text-base);letter-spacing:-.02em;margin-bottom:7px}
.feat p{color:var(--muted);font-size:var(--text-base);line-height:1.55}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
.step3{display:flex;flex-direction:column;gap:7px}
.stepnum{
  width:32px;height:32px;border-radius:999px;background:var(--ink);color:var(--paper);
  display:grid;place-items:center;font-size:var(--text-base);font-weight:700;
}
.step3 b{font-size:var(--text-lg);letter-spacing:-.02em}
.step3 p{color:var(--muted);font-size:var(--text-base);line-height:1.55}
/* Ground comes from the shared `.band.dark,.trustband` rule below; this used
   to set it from var(--ink) and was fully overridden. The h2 rule was dead
   too -- the trust band markup has no h2. Body grey matches the dark layer's
   #AEB8C4 rather than carrying a second value for the same job on the same
   ground, now that both sections resolve to #000000. */
.trustband .sub{color:#AEB8C4}
.trustrow{display:flex;flex-wrap:wrap;gap:14px 34px;justify-content:center}
.tritem{
  display:inline-flex;align-items:center;gap:8px;color:var(--paper);
  font-size:var(--text-base);font-weight:700;letter-spacing:-.015em;
}
/* --gold #D4A94E is a second accent on the same black ground the rest of the
   dark layer serves with --accent-on-dark. One accent per ground. */
.tritem svg{color:var(--accent-on-dark)}
.finalcta{border-bottom:0}
.ctarow{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:20px}
/* coach landing */
.chero-in{display:grid;grid-template-columns:55fr 45fr;gap:48px;align-items:center}
.chero-in .display{font-size:var(--text-hero);text-align:left}
.chero-in .lede{text-align:left;max-width:46ch}
.split{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center}
.split.rev .splitcopy{order:2}
.splitcopy h2{margin-bottom:11px}
.tlink{color:var(--slate);font-weight:700;font-size:var(--text-base);margin-top:14px}
.tlink:hover{text-decoration:underline}
.foundernote{max-width:64ch;margin:0 auto;text-align:center}
.foundernote p{color:var(--ink-2);font-size:var(--text-base);line-height:1.65;margin-top:14px}
.foundernote .sig{color:var(--muted);font-size:var(--text-base);margin-top:16px}
.pricingblock{max-width:620px;margin:0 auto}
.pricecard{
  border:1px solid var(--rule-strong);border-radius:var(--r-l);padding:32px;
  text-align:center;background:var(--paper);box-shadow:var(--shadow);margin-top:22px;
}
.bignum{font-size:var(--text-hero);font-weight:800;letter-spacing:-.02em;line-height:1;color:var(--slate)}
.pricecard p{margin-top:10px;font-size:var(--text-base)}
.pricelist{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-direction:column;gap:10px;text-align:left}
.pricelist li{
  display:flex;gap:10px;align-items:flex-start;color:var(--ink-2);font-size:var(--text-base);
}
.pricelist li::before{content:"✓";color:var(--good);font-weight:700;flex:0 0 auto}
.faqwrap{max-width:760px;margin:0 auto}
.faq{margin-top:24px;border-top:1px solid var(--rule-strong)}
.faqitem{border-bottom:1px solid var(--rule-strong)}
.faqq{
  display:flex;justify-content:space-between;align-items:center;gap:18px;width:100%;
  padding:19px 2px;text-align:left;font-size:var(--text-base);font-weight:700;letter-spacing:-.018em;
}
.faqq:hover{color:var(--slate)}
.faqi{font-size:21px;color:var(--muted);flex:0 0 auto;line-height:1}
.faqa{padding:0 2px 21px;color:var(--muted);font-size:var(--text-base);line-height:1.62;max-width:66ch}
@media(max-width:980px){
  .sportgrid{grid-template-columns:repeat(2,1fr)}
  .frames,.featgrid,.steps{grid-template-columns:1fr}
  .chero-in,.split{grid-template-columns:1fr;gap:30px}
  .split.rev .splitcopy{order:0}
  .chero-in .display,.chero-in .lede{text-align:left}
  .band{padding:52px 0}
  /* .band.hero is (0,2,0) and outranked this, so the hero was the one band on
     the page that never compressed -- 86+96 = 182px above the H1 on desktop
     and still 142px on a phone while every neighbour dropped to 52. */
  .band.hero{padding:56px 0 50px}
  /* The browser-chrome mock's proportion IS the component. Going 3 -> 1 with
     no intermediate rule made each frame ~930px wide and ~200px tall across
     the whole 640-980 range. */
  .frames{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .frames{grid-template-columns:1fr}
}
/* The search pill only reflowed at <=640 while everything around it moved at
   980, leaving a dead band. At 700px the "What" field is ~236px of content box
   against a 245px placeholder, so the placeholder clipped with no indication.
   Give the segments room before that happens. */
@media(max-width:900px) and (min-width:641px){
  .sp-where{flex:0 0 22%}
  .sp-age{flex:0 0 20%}
  .hero .searchpill .seg::placeholder{font-size:var(--text-sm)}
}

/* ── coach dashboard ─────────────────────────────────────────────── */
/* ── coach dashboard: dark ground ────────────────────────────────────
   Scoped token re-declaration, same mechanism as `reg-serious`: the class
   re-declares the surface and ink tokens AND sets background/color on itself.
   The second part is required — a custom property only changes an element that
   actually evaluates it, and most text here inherits its colour from <body>,
   which sits outside this wrapper.

   Every value is a LITERAL, never a token that can itself resolve dark. That is
   the near-black-on-black failure this repo has already shipped once.

   --accent is re-pointed at --accent-on-dark (#F08A62, 8.52:1) because the light
   --accent #C2410C measures 4.06:1 on black and is banned there for anything but
   large display type. Slate #8FA3BC carries the cool accent; sport colours stay
   accent-only (tag, glyph, dot, 3px bar) and never become chrome or body text. */
/* #app carries only the ground, so the black runs full-bleed behind the centred
   .shell column. The TOKENS are scoped to the coach surfaces below — putting
   them on #app leaked light --muted into the footer and topbar, which keep
   their own light backgrounds, and produced 2.2:1 near-white-on-white. Same
   failure as near-black-on-black, mirrored. */
#app.coachdark{background:#0B0C0E}
#app.coachdark .coachtop,
#app.coachdark .dash{
  --paper:#0B0C0E; --raise:#131519; --raise2:#1B1F26;
  /* --faint lifted from #7A8794 to #8B98A6: the stock value lands at 4.40:1 on
     --raise here, just under the 4.5 body-text floor. */
  --ink:#F5F7F9; --ink-2:#C3CBD4; --muted:#9AA6B2; --faint:#8B98A6;
  --rule:#242932; --rule-strong:#333A45;
  --slate:#8FA3BC; --slate-deep:#A9BACF; --slate-tint:#1A212B;
  --slate-ring:rgba(143,163,188,.34);
  --gold-ink:#E3C275; --gold-tint:#241E10;
  --good-tint:#10251A; --warn-tint:#251C0C;
  --accent:#F08A62; --accent-ink:#F08A62; --accent-tint:#2A1710;
  --danger:#F08A8A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55),0 18px 48px -18px rgba(0,0,0,.8);
  background:#0B0C0E;
  color:#F5F7F9;
}
/* Slate is lighter on this ground (#8FA3BC), so anything sitting ON slate takes
   dark ink, not white — white measures 2.58:1 there. Same resolution the dark
   bands already use at `.band.dark .btn:not(.ghost)`. */
#app.coachdark .btn:not(.ghost){background:#8FA3BC;color:#0B0C0E}
#app.coachdark .btn:not(.ghost):hover{background:#A9BACF;color:#0B0C0E}
#app.coachdark .avatar,
#app.coachdark .rbadge,
#app.coachdark .cal-num.today,
#app.coachdark .bub.me{color:#0B0C0E}
/* Hardcoded light values inside the coach shell that tokens cannot reach.
   .cmdbar is a fixed, near-white panel — the command bar itself. Its text took
   the dark-ground tokens while its own background stayed white, leaving the
   suggestion chips at 2.38:1. It only renders wide, which is why a default
   viewport misses it and 1440x900 catches it. */
#app.coachdark .cmdbar{
  background:rgba(19,21,25,.98);
  box-shadow:0 6px 8px rgba(0,0,0,.42),0 18px 48px rgba(0,0,0,.55);
}
#app.coachdark .cmdgo{color:#0B0C0E}
#app.coachdark .cmdspinner{border-color:rgba(11,12,14,.38);border-top-color:#0B0C0E}
/* Orange earns one job on this ground: the live send affordance. */
#app.coachdark .cmdinput.has-value .cmdgo{background:#F08A62}
#app.coachdark .cmdinput.has-value .cmdgo:hover{background:#F5A183}
.coachtop{position:sticky;top:77px;z-index:45;border-bottom:1px solid var(--rule);background:rgba(255,255,255,.96)}
#app.coachdark .coachtop{background:rgba(11,12,14,.96)}
.coachtop-in{display:flex;justify-content:flex-end;align-items:center;gap:4px;min-height:48px;padding:5px 24px}
.viewas{color:var(--slate)}
.railhead{display:flex!important;gap:11px;align-items:center;padding:11px 12px!important;text-align:left}
.railhead b{display:block;font-size:var(--text-base);letter-spacing:-.015em;color:var(--ink)}
.railhead span span{display:block;font-size:var(--text-sm);color:var(--muted)}
.raildiv{height:1px;background:var(--rule);margin:9px 0}
.rbadge{
  margin-left:auto;display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 6px;
  border-radius:999px;background:var(--slate);color:#fff;font-size:var(--text-xs);font-weight:700;
}
.railgs{flex-direction:column;align-items:flex-start!important;gap:6px}
.gsbar{display:block;width:100%;height:5px;border-radius:999px;background:var(--raise2);overflow:hidden}
.gsbar i{display:block;height:100%;background:var(--slate);border-radius:999px}
.gsbar.big{height:8px}
.dash{width:100%;max-width:none;grid-template-columns:236px minmax(0,1fr);gap:0;padding:0;align-items:start}
.dash>.rail{
  position:fixed;left:0;top:126px;bottom:0;width:236px;z-index:40;overflow-y:auto;
  padding:22px 18px 30px;border-right:1px solid var(--rule);background:var(--paper);
}
.dash>div{grid-column:2;min-width:0;width:min(1240px,100%);margin:0 auto;padding:0 34px}
.dashwrap{display:flex;flex-direction:column;gap:52px;padding:28px 0 250px}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-bottom:1px solid var(--rule)}
.metric{min-width:0;border:0;border-right:1px solid var(--rule);border-radius:0;padding:8px 20px 18px;background:transparent}
.metric:first-child{padding-left:0}.metric:last-child{border-right:0;padding-right:0}
.metric .k{font-size:var(--text-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.metric .v{font-size:var(--text-lg);font-weight:800;letter-spacing:-.02em;margin:5px 0 7px;font-family:var(--sans)}
.metric .d{font-size:var(--text-sm);color:var(--muted);line-height:1.35;margin-top:4px}
.spark{width:100%;height:22px;display:block}
.sparkdash{color:var(--rule-strong);font-size:20px}
.livebox{background:transparent}
.livecount{display:flex;align-items:center;gap:8px;font-size:var(--text-lg);font-weight:800;letter-spacing:-.02em;font-family:var(--sans)}
.livecount .dot{
  width:9px;height:9px;border-radius:999px;background:var(--good);flex:0 0 auto;
  animation:livepulse 2.2s infinite cubic-bezier(.4,0,.2,1);
}
@keyframes livepulse{0%,70%,100%{opacity:.35}35%{opacity:1}}
.lastdays{color:var(--faint);font-size:var(--text-sm);margin-top:-42px}
.dashwelcome{text-align:center;max-width:900px;margin:10px auto 4px;padding:42px 24px 34px}
.dashhello{font-size:var(--text-base);font-weight:700;color:var(--muted);margin-bottom:16px}
.greet{font-family:var(--sans);font-size:var(--text-hero);font-weight:800;letter-spacing:-.04em;line-height:1.02;text-wrap:balance}
.greet span{color:var(--slate)}
.dashcontext{max-width:58ch;margin:18px auto 0;color:var(--muted);font-size:var(--text-base);line-height:1.55}
.cmdbar{
  position:fixed;z-index:80;left:calc(236px + (100vw - 236px)/2);bottom:28px;
  width:min(750px,calc(100vw - 300px));transform:translateX(-50%);
  display:flex;flex-direction:column;border:1px solid var(--rule-strong);
  border-radius:26px;background:rgba(255,255,255,.98);overflow:hidden;
  box-shadow:0 6px 8px rgba(11,12,14,.06),0 18px 48px rgba(11,12,14,.12);
  transition:border-color .18s,box-shadow .18s,transform .18s;
}
.cmdbar:focus-within{border-color:var(--slate);box-shadow:0 0 0 4px var(--slate-ring),0 18px 48px rgba(11,12,14,.14)}
.cmdchips{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.cmdchips::-webkit-scrollbar{display:none}
.cmdchip{
  display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 11px;border:0;border-radius:var(--r-ctl);
  color:var(--muted);font-size:var(--text-sm);font-weight:600;background:transparent;white-space:nowrap;transition:.15s;
}
.cmdchip svg{width:15px;height:15px}.cmdchip:hover{color:var(--ink);background:var(--raise)}
.cmdchip.on{color:var(--slate-deep);background:var(--slate-tint)}
.cmdchip:focus-visible{outline:2px solid var(--slate);outline-offset:-2px}
/* leading history icon: icon-only, sits at the far left of the action bar */
.cmdhist{padding:0;width:36px;justify-content:center;color:var(--faint)}
/* "View all actions" pushed to the right, behind a hairline, per the reference */
.cmdchip-end{margin-left:auto;position:relative;padding-left:16px}
.cmdchip-end::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:1px;background:var(--rule)}
/* the model selector's dropdown chevron */
.cmdmodel .cmdchev{opacity:.65;flex:0 0 auto}
.cmdinput{
  display:flex;align-items:center;gap:8px;min-height:68px;padding:10px 12px 10px 16px;border:0;
  border-radius:0;background:transparent;box-shadow:none;transition:.16s;
}
.cmdinput:focus-within{border-color:transparent;box-shadow:none}
.cmdinput input{flex:1;border:0;background:none;font:inherit;font-size:var(--text-base);color:var(--ink);min-width:0;padding:0 4px}
.cmdinput input:focus{outline:none}
.cmdicon{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--muted);flex:0 0 auto;transition:.15s}
.cmdicon:hover{background:var(--raise2);color:var(--ink)}
.cmdicon:focus-visible,.cmdgo:focus-visible,.cmdmodel:focus-visible{outline:2px solid var(--slate);outline-offset:2px}
.cmdmodel{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:var(--r-ctl);color:var(--muted);font-size:var(--text-sm);font-weight:700;white-space:nowrap}
.cmdmodel:hover{background:var(--raise);color:var(--ink)}
/* Model picker menu — opens upward from the bottom-docked command bar. */
.cmdmodelwrap{position:relative;display:inline-flex}
.cmdmodelmenu{position:absolute;bottom:calc(100% + 10px);right:0;z-index:40;width:292px;
  background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-l);
  box-shadow:0 20px 52px -18px rgba(11,12,14,.42);padding:6px;display:flex;flex-direction:column;gap:2px}
.cmdmodelopt{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:var(--r-m);width:100%}
.cmdmodelopt:hover{background:var(--raise)}
.cmdmodelopt.on{background:var(--slate-tint)}
.cmdmodelopt .mm-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.cmdmodelopt .mm-name{font-weight:700;font-size:var(--text-base);letter-spacing:-.01em;color:var(--ink)}
.cmdmodelopt .mm-note{font-size:var(--text-sm);color:var(--muted);line-height:1.35}
.cmdmodelopt .mm-check{color:var(--slate);flex:0 0 auto}
.cmdmodelmenu .mm-foot{font-size:var(--text-xs);color:var(--faint);padding:8px 10px 3px;border-top:1px solid var(--rule);margin-top:4px}
.cmdgo{width:44px;height:44px;border-radius:var(--r-pill);background:var(--slate);color:#fff;display:grid;place-items:center;flex:0 0 auto;opacity:0;transform:scale(.82);pointer-events:none;transition:.16s}
.cmdinput.has-value .cmdgo,.cmdinput.sending .cmdgo{opacity:1;transform:scale(1);pointer-events:auto}
.cmdgo:hover{background:var(--slate-deep)}
.cmdgo:disabled,.cmdicon:disabled{opacity:.45;cursor:not-allowed}
.cmdinput.sending .cmdgo{opacity:.62}
.cmdspinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.38);border-top-color:#fff;border-radius:var(--r-pill);animation:cmdspin .7s linear infinite}
@keyframes cmdspin{to{transform:rotate(360deg)}}
.cmderror{padding:0 18px 12px;color:var(--danger);font-size:var(--text-sm);font-weight:600}
/* Confirmation step for an AI-parsed action. Deliberately plain: it is a
   read-back, not a call to action, so nothing here competes with the message. */
.cmdconfirm{margin:0 18px 14px;border:1px solid var(--rule);border-radius:var(--r-m);
  padding:13px 15px;background:var(--raise)}
.cmdconfirm-line{font-size:var(--text-sm);font-weight:600;color:var(--ink)}
.cmdconfirm-body{margin-top:7px;font-size:var(--text-sm);color:var(--ink-2)}
.cmdconfirm-actions{display:flex;gap:8px;margin-top:13px}
.cmdlog{border:1px solid var(--rule);border-radius:var(--r-m);padding:13px 15px;background:var(--raise)}
.cmdlogrow{display:flex;justify-content:space-between;gap:14px;font-size:var(--text-sm);color:var(--ink-2);padding:5px 0}
.cmdlogrow .num{color:var(--faint);flex:0 0 auto}
.todaystrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.todaycard{display:flex;gap:13px;border:1px solid var(--rule);border-radius:var(--r-l);padding:16px;background:var(--paper)}
.tspine{width:4px;border-radius:3px;flex:0 0 auto}
.tstime{font-size:var(--text-sm);font-weight:700;color:var(--muted)}
.todaycard b{display:block;font-size:var(--text-base);letter-spacing:-.02em;margin:3px 0}
.tsmeta{font-size:var(--text-sm);color:var(--muted)}
.tsbtns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.queue{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:var(--r-l);overflow:hidden}
.qrow{display:flex;gap:12px;align-items:center;padding:15px 17px;background:var(--paper)}
.qrow+.qrow{border-top:1px solid var(--rule)}
.qdot{width:8px;height:8px;border-radius:999px;flex:0 0 auto;background:var(--warn)}
.qrow.good .qdot{background:var(--good)}
.qtext{flex:1;min-width:0}
.qtext b{display:block;font-size:var(--text-base);letter-spacing:-.015em}
.qtext span{font-size:var(--text-sm);color:var(--muted)}
.qexp{font-size:var(--text-sm);color:var(--faint);flex:0 0 auto}
.qacts{display:flex;gap:7px;flex:0 0 auto;flex-wrap:wrap}
.cardrow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cardrow.two{grid-template-columns:repeat(2,1fr)}
.gsline{display:flex;align-items:center;gap:11px;margin:12px 0 14px}
.gsline .num{font-size:var(--text-sm);color:var(--muted);flex:0 0 auto}
.gslist{display:flex;flex-direction:column;gap:2px}
.gsitem{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:var(--r-s);text-align:left;font-size:var(--text-base);transition:background .14s}
.gsitem:hover{background:var(--raise2)}
.gscheck{
  width:17px;height:17px;border-radius:999px;border:1.5px solid var(--rule-strong);
  display:grid;place-items:center;color:#fff;flex:0 0 auto;
}
.gsitem.done .gscheck{background:var(--good);border-color:var(--good)}
.gsitem.done span:last-child{color:var(--muted);text-decoration:line-through}
.strengthwrap{display:flex;gap:16px;align-items:center;margin-top:10px}
.payflow{display:flex;gap:8px;margin:14px 0 12px}
.payst{flex:1;border:1px solid var(--rule);border-radius:var(--r-s);padding:9px 10px}
.payst.on{border-color:var(--good);background:var(--good-tint)}
.payst .num{display:block;font-weight:700;font-size:var(--text-base);margin-top:2px}
.rvmini{padding:11px 0;border-top:1px solid var(--rule)}
.rvmini:first-of-type{border-top:0}
.rvmini p{font-size:var(--text-sm);color:var(--muted);margin-top:4px;line-height:1.5}
.sharerow{display:flex;gap:9px;align-items:center;margin:12px 0}
.shareurl{
  flex:1;font-family:var(--mono);font-size:var(--text-sm);padding:9px 12px;background:var(--raise2);
  border-radius:var(--r-s);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.qrwrap{display:flex;gap:14px;align-items:center}
.qr{
  display:grid;grid-template-columns:repeat(21,1fr);width:104px;height:104px;
  border:6px solid var(--paper);background:var(--paper);flex:0 0 auto;
  outline:1px solid var(--rule);
}
.qr i{background:transparent}
.qr i.on{background:var(--ink)}
@media(max-width:1100px){
  .metrics{grid-template-columns:repeat(2,1fr)}
  .cardrow,.cardrow.two{grid-template-columns:1fr}
  .qrow{flex-wrap:wrap}
  .qacts{width:100%}
}

/* ── site footer ─────────────────────────────────────────────────── */
.sitefoot{border-top:1px solid var(--rule);padding:56px 0 30px;background:#EEF1FB}
:root[data-theme="dark"] .sitefoot{background:var(--raise)}
.footgrid{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:30px}
.footbrand{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding-right:20px}
.footbrand .wordmark{
  text-transform:uppercase;color:var(--ink);font-size:var(--text-xl);
}
.footbrand p{color:var(--muted);font-size:var(--text-base);line-height:1.5;max-width:250px}
.footcol{display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.footcol .eyebrow{margin-bottom:3px}
.footcol button,.footcol a{
  font-size:var(--text-base);color:var(--muted);text-align:left;text-decoration:none;transition:color .14s;
}
.footcol button:hover,.footcol a:hover{color:var(--ink)}
.footbase{
  display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
  margin-top:38px;padding-top:24px;border-top:1px solid var(--rule);
}
.footlegal{display:flex;gap:18px;flex-wrap:wrap;color:var(--faint);font-size:var(--text-sm)}
.footbase{justify-content:center;text-align:center;border-top-color:var(--rule-strong)}
.footbase .footlegal{justify-content:center}
@media(max-width:1000px){.footgrid{grid-template-columns:repeat(3,1fr);gap:28px}
  .footbrand{grid-column:1/-1;padding-right:0}}
@media(max-width:760px){.footgrid{grid-template-columns:repeat(2,1fr);gap:26px}}

/* ── T5 close-zone: Amboras-style dark closer fused with the footer ──
   Obsidian ground (#0B0C0E, already the hero base) with a top hairline; all
   text is white / white-alpha LITERALS (§3). closer-title uses Instrument
   Serif via --display; its clamp caps at 54px (an on-scale --text-hero max)
   because 64px is off the 8-step type scale the smoke test enforces. */
.close-zone{background:#0B0C0E;border-top:1px solid #1C222B;padding:74px 0 34px}
.closer{display:grid;grid-template-columns:1.1fr 1.4fr;gap:56px;align-items:start}
.closer-left{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.close-zone .wordmark{color:#fff;text-transform:uppercase;font-size:var(--text-xl)}
.closer-title{font-family:var(--display);font-weight:400;color:#F5F7F9;
  font-size:clamp(44px,4.6vw,54px);line-height:1.02;letter-spacing:-.01em}
.closer-title em{font-style:italic}
.closer-link{display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  color:#F5F7F9;font-family:var(--sans);font-weight:600;font-size:var(--text-base)}
.closer-link svg{width:15px;height:15px;flex:0 0 auto}
.closer-link:hover{color:#fff;text-decoration:underline}
.closer-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.closer-col{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.closer-col h5{font-family:var(--sans);text-transform:uppercase;letter-spacing:.14em;
  font-size:var(--text-xs);font-weight:700;color:rgba(245,247,249,.5);margin-bottom:4px}
.closer-col button,.closer-col a{font-family:var(--sans);font-size:var(--text-base);
  color:rgba(245,247,249,.72);text-align:left;text-decoration:none;transition:color .14s}
.closer-col button:hover,.closer-col a:hover{color:#F5F7F9}
.closer-base{margin-top:42px;padding-top:24px;border-top:1px solid #1C222B;
  display:flex;flex-direction:column;gap:6px}
.closer-base span{color:rgba(245,247,249,.5);font-size:var(--text-sm)}
@media(max-width:900px){
  .closer{grid-template-columns:1fr;gap:38px}
  .closer-cols{grid-template-columns:repeat(2,1fr)}
}

/* ── notification settings ───────────────────────────────────────── */
.notifhead,.notifrow{
  display:grid;grid-template-columns:1fr 74px 74px 74px;gap:12px;align-items:center;
  padding:14px 20px;
}
.notifhead{
  border-bottom:1px solid var(--rule);font-size:var(--text-xs);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
}
.notifhead span:not(:first-child),.notifrow .sw{justify-self:center}
.notifrow+.notifrow{border-top:1px solid var(--rule)}
.sw{display:inline-flex;cursor:pointer}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .track2{
  width:40px;height:23px;border-radius:999px;background:var(--rule-strong);
  display:block;position:relative;transition:background .18s;
}
.sw .knob{
  position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:999px;
  background:var(--paper);box-shadow:0 1px 3px rgba(11,12,14,.3);transition:transform .18s cubic-bezier(.4,0,.2,1);
}
.sw input:checked+.track2{background:var(--slate)}
.sw input:checked+.track2 .knob{transform:translateX(17px)}
.sw input:focus-visible+.track2{outline:2px solid var(--slate);outline-offset:2px}
@media(max-width:620px){
  .notifhead,.notifrow{grid-template-columns:1fr 46px 46px 46px;gap:6px;padding:13px 14px}
  .sw .track2{width:34px;height:20px}.sw .knob{width:14px;height:14px}
  .sw input:checked+.track2 .knob{transform:translateX(14px)}
}

/* ── toast ───────────────────────────────────────────────────────── */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:200;
  background:var(--ink);color:var(--paper);padding:13px 21px;border-radius:999px;
  font-size:var(--text-base);font-weight:600;box-shadow:var(--shadow-lift);animation:rise .2s;
}

/* ── responsive: web layout collapses toward the app's stack ─────── */
@media(max-width:1020px){
  .detail{grid-template-columns:1fr;gap:30px}
  .bookcard{position:static}
  .dash{grid-template-columns:1fr;gap:20px;padding:0 24px}
  .dash>.rail{position:static;width:auto;padding:14px 0;border-right:0;border-bottom:1px solid var(--rule);flex-direction:row;overflow-x:auto}
  .dash>div{grid-column:1;padding:0;width:100%}
  .rail button{white-space:nowrap}
  .metrics{grid-template-columns:repeat(3,1fr)}
  .metric{border-right:0;border-bottom:1px solid var(--rule);padding:12px 16px}
  .metric:first-child{padding-left:16px}
  .cmdbar{left:50%;width:min(750px,calc(100vw - 48px));bottom:22px}
  .msg-wrap{grid-template-columns:1fr;height:auto}
  .msg-list{max-height:230px;border-right:0;border-bottom:1px solid var(--rule)}
  .msg-scroll{min-height:300px}
  .maplayout{grid-template-columns:1fr}
  .mapside{position:static}
  .mapcanvas{height:min(460px,58vh)}
}
@media(max-width:760px){
  .topbar-in{height:auto;padding:12px 0;flex-wrap:wrap;gap:12px}
  .searchpill{order:3;flex-basis:100%;max-width:none}
  .topnav .tnav{display:none}
  .gallery{grid-template-columns:1fr}
  .gallery .stack{grid-template-columns:1fr 1fr;display:grid}
  .incl{grid-template-columns:1fr}
  .shell{padding:0 16px}
  .coachtop{top:65px}.coachtop-in{overflow-x:auto;justify-content:flex-start;padding:5px 16px}
  .dash{padding:0 16px}.dashwrap{gap:40px;padding-bottom:230px}
  .metrics{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
  .metrics::-webkit-scrollbar{display:none}
  .metric,.metric:first-child{flex:0 0 152px;padding:12px;border-right:1px solid var(--rule);border-bottom:0;scroll-snap-align:start}
  .metric:last-child{border-right:0}
  .lastdays{margin-top:-30px}
  .dashwelcome{padding:28px 0 20px}.greet{font-size:var(--text-2xl);letter-spacing:-.035em;line-height:1.08}
  .cmdbar{width:calc(100vw - 24px);bottom:12px;border-radius:22px}
  .cmdchips{padding:7px 8px}.cmdchip{min-width:44px;justify-content:center;padding:0 10px}
  .cmdchip span{display:none}.cmdinput{min-height:62px;padding:8px 9px}
  .cmdmodel span{display:none}.cmdmodel{width:38px;padding:0;justify-content:center}
}
/* ── PARTS 2+3 · mega-menus ──────────────────────────────────────── */
.pmgrid4{display:grid;grid-template-columns:1fr 1.15fr 1.15fr 1px 1.1fr;gap:0;padding:30px 24px 26px}
.cmgrid{display:grid;grid-template-columns:1.5fr 1px 1fr;gap:0;padding:30px 24px 26px}
.pmgrid4 .pmcol,.cmgrid .pmcol{display:flex;flex-direction:column;gap:2px;padding:0 26px;min-width:0}
