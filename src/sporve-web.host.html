/* Coach command bar. Every action lands in an activity log — a trust
   requirement for automation that touches schedules and money. */
/* Normalised so "monday noon" resolves to a group named "Monday at noon".
   Filler words are dropped rather than matched, because a coach naming a group
   and a coach referring to it later rarely use the same connectives. */
const cmdNorm=s=>String(s||"").toLowerCase()
  .replace(/[^a-z0-9\s]/g," ")
  .split(/\s+/)
  .filter(w=>w&&!["at","the","a","an","on","of","group","chat"].includes(w))
  .join(" ");

/* Returns {group} on a single match, {ambiguous:[...]} when more than one group
   matches, or {} when none do. Ambiguity is a first-class outcome: guessing
   which of two groups the coach meant is how a message reaches the wrong
   families. */
function resolveGroup(name){
  const want=cmdNorm(name);
  if(!want) return {};
  const groups=S.conversations.filter(c=>(c.kind||"direct")==="group");
  const exact=groups.filter(c=>cmdNorm(c.name)===want);
  if(exact.length===1) return {group:exact[0]};
  if(exact.length>1) return {ambiguous:exact};
  const partial=groups.filter(c=>{
    const have=cmdNorm(c.name);
    return have.includes(want)||want.includes(have);
  });
  if(partial.length===1) return {group:partial[0]};
  if(partial.length>1) return {ambiguous:partial};
  return {};
}

/* Parse on the server, decide on the client. The model returns an action; this
   function judges whether it is runnable and, for anything that reaches a
   family, parks it in S.cmdPending for the coach to approve. If /api/ai is
   unreachable or has no key, we fall through to the built-in router so the
   page behaves exactly as it did before. */
async function submitCommand(text){
  if(S.cmdSending||!text||!text.trim())return;
  const q=text.trim();
  S.cmdDraft=q;S.cmdSending=true;S.cmdError="";S.cmdPending=null;render();
  let a=null;
  try{
    const r=await fetch("/api/ai",{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({
        text:q,
        groups:S.conversations.filter(c=>(c.kind||"direct")==="group").map(c=>c.name),
      }),
    });
    if(r.ok) a=await r.json();
  }catch(_){ /* offline, blocked, or no function — handled below */ }
  S.cmdSending=false;
  if(!a||!a.action||a.action==="unknown"){ runCommand(q); return; }
  applyAction(a,q);
}

function applyAction(a,original){
  if(a.action==="open_tab"){
    const tab=String(a.target||"").trim();
    if(!tab){ runCommand(original); return; }
    S.coachTab=tab;
    S.cmdDraft="";S.cmdError="";
    S.cmdLog=[{text:a.restated||("Opened "+tab),at:"just now"},...(S.cmdLog||[])].slice(0,8);
    render();toast(a.restated||("Opened "+tab));return;
  }
  if(a.action==="create_group"){
    S.cmdDraft="";S.cmdError="";S.modal={type:"newgroup",name:a.target||""};
    render();return;
  }
  if(a.action==="send_group_message"){
    const hit=resolveGroup(a.target);
    if(hit.ambiguous){
      S.cmdError="More than one group matches “"+a.target+"”: "+
        hit.ambiguous.map(g=>g.name).join(", ")+". Name one exactly.";
      render();return;
    }
    if(!hit.group){
      S.cmdError="No group named “"+a.target+"”. Create it first, or name an existing group.";
      render();return;
    }
    if(!String(a.body||"").trim()){
      S.cmdError="I understood the group but not the message. Say what to send.";
      render();return;
    }
    /* Parked, not sent. A misparse here reaches every family on the roster,
       so the coach reads it back before it goes. */
    S.cmdPending={convId:hit.group.id,body:String(a.body).trim(),
      restated:a.restated||("Send this to "+hit.group.name+".")};
    S.cmdError="";render();return;
  }
  runCommand(original);
}

function confirmPending(){
  const p=S.cmdPending; if(!p) return;
  const id=p.convId;
  (S.messages[id]=S.messages[id]||[]).push(
    {id:"msg_"+((S.messages[id]||[]).length+1),me:false,text:p.body,at:TODAY});
  const c=S.conversations.find(x=>x.id===id); if(c) c.last=p.body;
  if(S.unread) S.unread[id]=0;
  S.cmdPending=null;S.cmdDraft="";
  S.cmdLog=[{text:p.restated,at:"just now"},...(S.cmdLog||[])].slice(0,8);
  render();toast("Sent");
}
function runCommand(text){
  const t=text.toLowerCase();
  let did="";
  if(/confirm/.test(t)&&/session/.test(t)){did="Opened schedule to confirm sessions";S.coachTab="schedule";}
  else if(/fill|waitlist|open slot/.test(t)){did="Opened the waitlist";S.coachTab="waitlist";}
  else if(/message|family|families/.test(t)){did="Opened your inbox";S.coachTab="inbox";}
  else if(/find/.test(t)&&/(coach|team|camp)/.test(t)){did="Opened coach search";S.portal="family";S.route={name:"explore",arg:null};}
  else if(/create/.test(t)&&/event/.test(t)){did="Opened your schedule to create an event";S.coachTab="schedule";}
  else if(/all action|action queue/.test(t)){did="Opened your action queue";S.coachTab="dashboard";}
  else if(/to-do|todo|left|go live|what's left/.test(t)){did="Listed what's left before you go live";S.coachTab="dashboard";}
  else if(/availability|set my/.test(t)){did="Opened recurring availability";S.coachTab=modView("slots")?"slots":"schedule";}
  else if(/profile|build my/.test(t)){did="Opened your business profile";S.coachTab="profile";}
  else if(/note/.test(t)){did="Opened session notes";S.coachTab=modView("notes")?"notes":"schedule";}
  else {
    S.cmdError="I couldn't map that request to a safe action. Try naming a coach, session, family, or schedule task.";
    S.cmdDraft=text;render();return;
  }
  S.cmdDraft="";S.cmdAction="";S.cmdError="";
  S.cmdLog=[{text:did,at:"just now"},...(S.cmdLog||[])].slice(0,8);
  render();
  toast(did);
}

function askCoach(q){
  if(!q||!q.trim()) return;
  S.chat=[...S.chat,{role:"user",text:q.trim()}];
  S.chatThinking=true; render();
  setTimeout(()=>{
    const a=answerFor(q);
    S.chatThinking=false;
    S.chat=[...S.chat,{role:"coach",text:a.text,picks:a.picks}];
    render();
  },700);
}

/* Photography comes from external image hosts. Behind a strict CSP — or simply
   offline — those requests never land, and every card collapses to an empty
   box. Capture-phase, because `error` on <img> does not bubble. The stand-in
   is tinted with the listing's own sport colour, read off the badge that sits
   in the same frame, so a blocked page still reads as the same product. */
document.addEventListener("error",e=>{
  const img=e.target;
  if(!img||img.tagName!=="IMG"||img.dataset.fallback) return;
  img.dataset.fallback="1";
  const dot=img.parentElement&&img.parentElement.querySelector(".sporttag i");
  const c=(dot&&dot.style.background)||"#223140";
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${c}" stop-opacity=".30"/>
        <stop offset="1" stop-color="${c}" stop-opacity=".08"/>
      </linearGradient></defs>
      <rect width="600" height="400" fill="#EFF2F5"/>
      <rect width="600" height="400" fill="url(#g)"/>
      <text x="300" y="212" text-anchor="middle" font-family="Arial,sans-serif"
            font-size="34" font-weight="800" letter-spacing="6"
            fill="${c}" fill-opacity=".55">SPORVE</text>
    </svg>`);
},true);

document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(S.modal){S.modal=null;S.pendingIntent=null;render();}
  else if(S.sportOpen){S.sportOpen=false;render();}
  /* mega-menus are pure CSS :focus-within, so Escape closes them by moving
     focus off the trigger — and the trigger's aria-expanded is kept honest */
  else{
    const open=document.querySelector(".prodwrap:focus-within");
    if(open){const t=open.querySelector(".tnav");
      if(t){t.setAttribute("aria-expanded","false");t.blur();}
      if(document.activeElement&&open.contains(document.activeElement)) document.activeElement.blur();}
  }
});

<script>
/* ── session persistence ───────────────────────────────────────────────
   Everything the page knows lives in the in-memory object S, so a refresh
   used to discard every booking, message, note and onboarding step on a
   product whose pitch is "run your business on it".

   sessionStorage, not localStorage, on purpose: work survives a reload and a
   navigation, and a closed tab returns to the seeded demo. Persisting demo
   data forever would strand people in a stale sandbox with no reset.

   Four properties make a bad snapshot safe to load:

   1. A VERSION in the key. Change the shape of S, bump it, and every old
      snapshot is ignored rather than half-applied.
   2. MERGE, never replace. Only keys that already exist in S are restored,
      so a key added after a snapshot was written keeps its default instead
      of becoming undefined, and a foreign or tampered key cannot inject
      state that no code expects.
   3. EPHEMERAL keys are excluded in BOTH directions. Restoring an open
      modal, an in-flight spinner, or a half-typed command is confusing at
      best. cmdPending matters most: it is an unconfirmed broadcast to every
      family on a roster, and it must not outlive the screen that made it —
      the same reason leaving the tab drops it.
   4. Every path is wrapped. Quota exhaustion, private-mode denial, or a
      corrupt entry must degrade to "no persistence", never to a blank page.
      A failed parse also clears the entry so the next load starts clean. */
const PERSIST_KEY = "sporve:state:v1";
const EPHEMERAL = new Set([
  "modal", "toast", "pendingIntent",
  "cmdDraft", "cmdSending", "cmdError", "cmdPending", "cmdAction", "cmdModelOpen",
  "chatThinking", "sportOpen", "sportAnchor", "faqOpen", "forgotSent", "mapPick",
]);

function saveState(){
  try{
    const out = {};
    for(const k of Object.keys(S)) if(!EPHEMERAL.has(k)) out[k] = S[k];
    sessionStorage.setItem(PERSIST_KEY, JSON.stringify(out));
  }catch(e){ /* quota, private mode, or a cycle — persistence is optional */ }
}

function loadState(){
  try{
    const raw = sessionStorage.getItem(PERSIST_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(!saved || typeof saved !== "object" || Array.isArray(saved)) return false;
    /* Iterate the keys S ALREADY has, not the keys storage offers. The
       inverted form is not a style preference — it closes a real hole.
       JSON.parse creates `__proto__` as an OWN property, so it survives
       Object.keys(saved); and `'__proto__' in S` is true by inheritance, so a
       `k in S` guard lets it through and `S[k] = ...` then replaces S's
       prototype. Driving the loop from Object.keys(S) means a key S does not
       already own can never be assigned, whatever storage contains.

       Types are checked too: a snapshot whose `messages` is a string, or whose
       `bookings` is an object, would render into exceptions all over the app.
       Shape mismatch means the snapshot is not ours — skip that key and keep
       the default rather than trusting it. */
    const kind = v => Array.isArray(v) ? "array" : v === null ? "null" : typeof v;
    for(const k of Object.keys(S)){
      if(EPHEMERAL.has(k)) continue;
      if(!Object.prototype.hasOwnProperty.call(saved, k)) continue;
      if(kind(saved[k]) !== kind(S[k])) continue;
      S[k] = saved[k];
    }
    return true;
  }catch(e){
    try{ sessionStorage.removeItem(PERSIST_KEY); }catch(_){}
    return false;
  }
}

/* Coalesced: render() runs on every interaction, and serialising 28KB on each
   one is wasted work. One write per frame-ish window is enough, because the
   only reader is the next page load. */
let saveTimer = null;
function scheduleSave(){
  if(saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = null; saveState(); }, 250);
}

/* boot: merge module state, restore the session, then first paint.
   Order is load-critical — bootModules() seeds module keys with
   `if(!(k in S))`, so restoring before it would have those defaults
   overwrite the saved values. */
bootModules();
loadState();
render();

/* Wrap render rather than editing it: every mutation path in the host and in
   every module already ends in render(), so this catches all of them without
   touching a single call site. */
const _renderNoPersist = render;
render = function(){ _renderNoPersist.apply(this, arguments); scheduleSave(); };
window.addEventListener("pagehide", saveState);
</script>
